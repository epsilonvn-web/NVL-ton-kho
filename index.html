<!DOCTYPE html>
<html lang="vi-VN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Quản Trị Tồn Kho NVL - VHIP ERP</title>
    <style>
        :root {
            --vh-green: #27ae60;
            --vh-blue: #2980b9;
            --vh-dark: #2c3e50;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --danger: #e74c3c;
            --warning: #f39c12;
            --border-color: #cbd5e1;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--vh-dark); }
        
        /* HEADER TỪ TEMPLATE CHUẨN */
        .header { background: linear-gradient(135deg, #1a365d 0%, #2980b9 45%, #27ae60 100%); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img-wrapper { background: #ffffff; padding: 6px 14px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
        .logo-img-wrapper img { height: 30px; width: auto; display: block; }
        .logo-text { display: flex; align-items: center; gap: 6px; }
        .logo-text span:nth-child(1) { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; color: #ffffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .logo-text span:nth-child(2) { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; color: #a7f3d0; margin-left: 2px; }
        .user-panel { display: flex; align-items: center; gap: 20px; }
        .user-avatar { width: 36px; height: 36px; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; border: 2px solid white; color: white; }

        /* LAYOUT & TABS */
        .main-container { max-width: 1500px; margin: 25px auto; padding: 0 20px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; flex-wrap: wrap; }
        .nav-tab-btn { background: #e2e8f0; border: none; padding: 10px 18px; min-height: 44px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 14px; color: #475569; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .nav-tab-btn.active { background: var(--vh-blue); color: white; box-shadow: 0 4px 10px rgba(41,128,185,0.2); }
        .view-pane { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* STATS GRID & CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-left: 5px solid var(--vh-blue); display: flex; justify-content: space-between; align-items: center; }
        .stat-card.green { border-left-color: var(--vh-green); }
        .stat-card.warning { border-left-color: var(--warning); }
        .stat-card.danger { border-left-color: var(--danger); }
        .stat-info h4 { margin: 0 0 5px 0; color: #64748b; font-size: 12px; text-transform: uppercase; font-weight: 700; }
        .stat-info .num { font-size: 26px; font-weight: bold; color: var(--vh-dark); margin: 0; }
        
        .panel { background: var(--card-bg); border-radius: 10px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .panel-title { font-size: 17px; font-weight: bold; color: var(--vh-dark); margin-top: 0; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; flex-wrap: wrap; gap: 10px; }

        /* BẢNG DỮ LIỆU */
        .table-responsive { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 100%; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; vertical-align: middle; }
        th { background: #f8fafc; color: var(--vh-dark); font-weight: 600; white-space: nowrap; }
        .text-left { text-align: left !important; padding-left: 15px !important; }
        .text-right { text-align: right !important; padding-right: 15px !important; }

        /* BADGES CẢNH BÁO */
        .badge { padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; white-space: nowrap; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .badge-info { background: #e2e8f0; color: #334155; }

        /* TÌM KIẾM */
        .form-control { width: 100%; padding: 10px 12px; min-height: 44px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: var(--vh-blue); box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.15); }
        .search-bar { max-width: 400px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-img-wrapper"><img src="logo.png" alt="Logo Vĩnh Hưng"></div>
            <div class="logo-text"><span>VHIP</span><span>- TỒN KHO NVL</span></div>
        </div>
        <div class="user-panel">
            <div class="user-info" style="color:white; font-weight:600;">
                <span id="user-welcome-text">ADMIN DEMO</span>
            </div>
            <div class="user-avatar" id="avatar-icon">AD</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="main-container">

        <!-- BÁO DEMO (chỉ hiện khi chưa lấy được dữ liệu thật từ Google Sheet) -->
        <div id="demo-banner" style="display:none; background:#fff3cd; color:#856404; padding:10px 16px; border-radius:8px; margin-bottom:15px; font-size:13px; font-weight:600;">
            ⚠️ Chưa kết nối được với Google Sheet thật (link GAS_API_URL) — đang hiển thị dữ liệu demo để anh xem giao diện.
        </div>

        <!-- TABS: sinh tự động theo danh mục (sheet) lấy từ dữ liệu -->
        <div class="nav-tabs" id="nav-tabs-container">
            <button class="nav-tab-btn active" onclick="filterCategory('ALL', this)">📊 Dashboard Tổng</button>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Số Mã Đang Hiển Thị</h4>
                    <p class="num" id="stat-total">0</p>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-info">
                    <h4>Số Danh Mục</h4>
                    <p class="num" id="stat-categories">0</p>
                </div>
            </div>
        </div>

        <!-- MAIN PANEL -->
        <div class="panel view-pane active">
            <h3 class="panel-title">
                <span id="panel-heading">📦 Tồn Kho Nguyên Vật Liệu</span>
                <span style="font-size:12px; background:#fee2e2; color:#991b1b; padding:4px 8px; border-radius:12px;">Đồng bộ IMPORTRANGE: 2 ngày/lần</span>
            </h3>

            <input type="text" id="searchInput" class="form-control search-bar" placeholder="Tra cứu mã vật tư, tên vật tư..." onkeyup="renderTable()">

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="text-left">Mã Vật Tư</th>
                            <th class="text-left">Tên Vật Tư</th>
                            <th>ĐVT</th>
                            <th class="text-right">Tồn Kho</th>
                            <th class="text-left">Danh Mục</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body">
                        <!-- Dữ liệu JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toàn bộ logic lấy dữ liệu & xử lý nằm trong app.js, tách riêng khỏi giao diện -->
    <script src="assets/js/app.js"></script>
</body>
</html>
